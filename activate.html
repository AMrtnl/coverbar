<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activate CoverBar</title>
<meta name="description" content="Paste your CoverBar license key to open the app and activate it.">
<meta name="robots" content="noindex">
<link rel="icon" href="/coverbar/favicon.png" type="image/png">
<style>
  :root { color-scheme: dark; --bg: #141210; --card: #1e1b18; --text: #f6f1e8; --muted: #b7ab9c; --line: #3a342c; --accent: #f3ead9; }
  body { margin: 0; font: 17px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 38rem; margin: 0 auto; padding: 4.5rem 1.25rem 3rem; }
  a { color: var(--accent); }
  .back { color: var(--muted); text-decoration: none; font-size: .95rem; }
  h1 { font-size: 2rem; line-height: 1.15; letter-spacing: -.02em; margin: 1rem 0 .75rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 1.4rem 1.35rem 1.2rem; }
  ol { margin: .2rem 0 1rem; padding-left: 1.2rem; }
  li { margin: .4rem 0; }
  form { display: flex; gap: .6rem; flex-wrap: wrap; }
  input { flex: 1 1 14rem; font: 15px/1.3 ui-monospace, monospace; padding: .7rem .8rem; border-radius: 10px; border: 1px solid var(--line); background: #100e0c; color: var(--text); }
  button { background: var(--accent); color: #1a1612; border: 0; border-radius: 999px; padding: .7rem 1.1rem; font: inherit; font-weight: 650; }
  button:disabled { opacity: .45; }
  .muted { color: var(--muted); }
  footer { margin-top: 1.6rem; color: var(--muted); font-size: .9rem; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <a class="back" href="/coverbar/">CoverBar</a>
  <div class="card">
    <h1>Activate CoverBar</h1>
    <ol>
      <li><strong>Find the key</strong> in the receipt email from the payment. This page cannot look a purchase up.</li>
      <li><strong>Paste it here</strong> to open CoverBar with the key, or paste it in CoverBar → Settings → License.</li>
    </ol>
    <form id="activate">
      <input id="key" name="key" autocomplete="off" spellcheck="false" placeholder="Paste your license key" aria-label="License key">
      <button id="go" type="submit" disabled>Activate in CoverBar</button>
    </form>
    <p id="hint" class="muted"></p>
  </div>
  <footer>
    <p><a href="/coverbar/buy">Buy CoverBar</a> · <a href="/coverbar/privacy">Privacy</a> · <a href="/coverbar/terms">Terms</a></p>
  </footer>
</main>
<script>
(function () {
  var input = document.getElementById("key");
  var button = document.getElementById("go");
  var hint = document.getElementById("hint");

  function clean(value) {
    return String(value || "").replace(/[\s"'“”‘’<>\u200B\u200C\u200D\u2060\uFEFF]/g, "");
  }

  function refresh() {
    button.disabled = clean(input.value).length === 0;
  }

  var preset = new URLSearchParams(location.search).get("key");
  if (preset) input.value = preset;
  refresh();
  input.addEventListener("input", refresh);

  document.getElementById("activate").addEventListener("submit", function (event) {
    event.preventDefault();
    var key = clean(input.value);
    if (!key) return;
    hint.textContent = "Opening CoverBar. If nothing happens, paste the same key in Settings → License.";
    location.href = "coverbar://activate?key=" + encodeURIComponent(key);
  });
})();
</script>
</body>
</html>
